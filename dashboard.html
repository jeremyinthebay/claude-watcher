<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Claude Watcher</title>
<meta name="description" content="Live view of every Claude session on the mini — who's actually working, who's idle, and what each agent is doing.">
<style>
:root{--bg:#14181d;--card:#1c222a;--card2:#161c23;--ink:#e9edf2;--mut:#9aa7b4;--faint:#5c6670;
  --acc:#e0b24a;--line:#2b333d;--ok:#4cc38a;--warn:#e0b24a;--off:#5c6670;--red:#e5484d;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:32px 18px 60px}
h1{font-size:24px;margin:0}
.sub{color:var(--mut);font-size:13px;margin:6px 0 14px}
.topbar{position:sticky;top:0;z-index:5;display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  background:rgba(20,24,29,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  padding:10px 0;margin:0 0 10px}
.search{margin-left:auto;background:var(--card2);border:1px solid var(--line);border-radius:999px;
  color:var(--ink);font:13px inherit;padding:5px 14px;width:170px;outline:none}
.search:focus{border-color:var(--acc)}
.chip.tog{cursor:pointer;user-select:none;transition:opacity .12s,border-color .12s}
.chip.tog:hover{border-color:var(--acc)}
.chip.tog.off{opacity:.35}
.card{transition:border-color .15s}
.card:hover{border-color:#3a4550}
.empty{color:var(--faint);font-size:14px}
.empty a{color:var(--acc);cursor:pointer}
.strip{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;border:1px solid var(--line);
  border-radius:999px;padding:3px 12px;color:var(--mut);background:var(--card2)}
.chip b{color:var(--ink);font-weight:600}
.chip .d{width:8px;height:8px;border-radius:50%}
.chip.paused{color:var(--warn);border-color:rgba(224,178,74,.4)}
.chip.dead{color:var(--red);border-color:rgba(229,72,77,.5)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:10px 0}
.row{display:flex;align-items:baseline;gap:10px}
.dot{width:10px;height:10px;border-radius:50%;flex:0 0 10px;align-self:center}
.working>.row .dot{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.quiet>.row .dot{background:var(--warn)}
.idle>.row .dot{background:var(--off)}
.t{font-weight:600;font-size:15.5px}
.badge{font-size:11px;color:#1a1204;background:var(--acc);border-radius:999px;padding:1px 8px;font-weight:700;white-space:nowrap}
.mchip{font-size:11px;color:var(--mut);border:1px solid var(--line);border-radius:999px;padding:1px 8px;white-space:nowrap}
.meta{color:var(--faint);font-size:12px;margin-left:auto;text-align:right;white-space:nowrap}
.meta b{color:var(--mut);font-weight:600}
.doing{display:flex;gap:8px;align-items:center;margin:8px 0 0 20px;color:var(--mut);font-size:12.5px;min-width:0}
.doing .ico{flex:0 0 auto}
.doing code{font:12px var(--mono);color:#c6d2df;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.subs{margin:10px 0 2px 20px;border-left:2px solid var(--line);padding-left:12px}
.sa{display:flex;align-items:center;gap:8px;padding:4px 0;min-width:0}
.sa .sd{width:7px;height:7px;border-radius:50%;flex:0 0 7px}
.sa.on .sd{background:var(--ok)}
.sa.off .sd{background:var(--off)}
.role{font-size:11px;font-weight:700;letter-spacing:.02em;color:var(--acc);border:1px solid rgba(224,178,74,.35);
  border-radius:6px;padding:1px 7px;white-space:nowrap;flex:0 0 auto}
.sa.off .role{color:var(--mut);border-color:var(--line)}
.sa code{flex:1;font:12px var(--mono);color:#b7c3d0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.sa.off code{color:var(--faint)}
.rt{font-size:11.5px;color:var(--mut);font-variant-numeric:tabular-nums;white-space:nowrap;flex:0 0 auto}
details.done{margin:4px 0 0 20px}
details.done summary{cursor:pointer;color:var(--faint);font-size:12px;list-style:none;padding:2px 0}
details.done summary::before{content:"▸ ";color:var(--faint)}
details.done[open] summary::before{content:"▾ "}
details.done .subs{margin-left:0}
h2{font-size:14px;color:var(--mut);margin:26px 0 6px;text-transform:uppercase;letter-spacing:.06em}
code{font:12px var(--mono);color:#d7e2ee;word-break:break-all}
.mchip.cli{color:var(--acc);border-color:rgba(224,178,74,.35);font-weight:700}
.spark{display:flex;gap:2px;align-items:flex-end;height:16px;margin:8px 0 0 20px}
.spark i{display:block;width:8px;background:var(--ok);opacity:.75;border-radius:1px}
.sid{font:10.5px var(--mono)}
.stamp{color:var(--faint);font-size:12px;margin-top:18px}
@media(max-width:600px){
  .row{flex-wrap:wrap}
  .meta{margin-left:auto;white-space:normal;text-align:right}
  .sid{display:none}
  .sa .rt{display:none}
}
</style>
<style>
/* ---------- budget / usage section ---------- */
@property --p{syntax:'<percentage>';inherits:false;initial-value:0%}
.budget{margin:6px 0 4px}
.bhead{display:flex;align-items:baseline;gap:10px;margin:18px 0 10px}
.bhead h2{margin:0}
.bstamp{margin-left:auto;color:var(--faint);font-size:11.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.bwarn{background:rgba(229,72,77,.08);border:1px solid rgba(229,72,77,.4);border-radius:12px;
  padding:9px 14px;margin:0 0 10px;color:var(--red);font-size:12.5px}
.bwarn b{color:var(--ink)}
.bwarn .tail{color:var(--faint);font:11px var(--mono)}
.heroes{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.hero{position:relative;background:linear-gradient(180deg,var(--card) 0%,var(--card2) 130%);
  border:1px solid var(--line);border-radius:14px;padding:13px 15px 12px;overflow:hidden;
  transition:border-color .15s,transform .15s}
.hero:hover{border-color:#3a4550}
.hero::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent 5%,rgba(224,178,74,.55) 50%,transparent 95%)}
.hlabel{font-size:10.5px;font-weight:700;letter-spacing:.15em;color:var(--faint)}
.hnum{font-size:28px;font-weight:700;letter-spacing:-.01em;color:var(--ink);
  font-variant-numeric:tabular-nums;line-height:1.25;margin:2px 0 1px}
.hdelta{font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdelta.up{color:var(--red)}
.hdelta.down{color:var(--ok)}
.hdelta.flat{color:var(--faint)}
.hdelta .hvs{color:var(--faint)}
.hcost{position:absolute;top:9px;right:11px;font:11px var(--mono);color:var(--acc);
  background:rgba(224,178,74,.1);border:1px solid rgba(224,178,74,.28);border-radius:999px;padding:2px 8px;
  font-variant-numeric:tabular-nums}
.bgrid{display:grid;grid-template-columns:3fr 2fr;gap:10px;margin-top:10px}
.bcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;
  transition:border-color .15s;min-width:0}
.bcard:hover{border-color:#3a4550}
.blabel{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:var(--faint);margin:0 0 10px}
.berr{grid-column:1/-1;color:var(--red);font-size:13px}
.bmut{color:var(--faint);font-size:13px}
/* 14-day trend */
.tbars{display:flex;gap:4px;align-items:flex-end;height:76px}
.tcol{flex:1;display:flex;align-items:flex-end;height:100%;min-width:0;cursor:default}
.tbar{width:100%;background:var(--acc);border-radius:3px 3px 1px 1px;transform-origin:bottom;
  transition:filter .12s}
.tcol:hover .tbar{filter:brightness(1.35)}
.tbar.now{box-shadow:0 0 10px rgba(224,178,74,.55),0 0 2px rgba(224,178,74,.8)}
.taxis{display:flex;justify-content:space-between;margin-top:6px;font-size:10.5px;color:var(--faint);
  font-variant-numeric:tabular-nums}
.taxis .now{color:var(--acc);font-weight:700;letter-spacing:.04em}
/* model mix */
.mixbar{display:flex;height:14px;border-radius:999px;overflow:hidden;background:var(--card2);
  border:1px solid var(--line)}
.mseg{transform-origin:left;min-width:3px}
.mseg+.mseg{border-left:2px solid var(--card)}
.mlegend{margin-top:11px;display:flex;flex-direction:column;gap:6px}
.mrow{display:flex;align-items:center;gap:8px;font-size:12.5px;min-width:0}
.mdot{width:9px;height:9px;border-radius:3px;flex:0 0 9px}
.mname{color:var(--ink);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mpct{color:var(--mut);font-variant-numeric:tabular-nums;flex:0 0 auto}
.mcost{margin-left:auto;color:var(--faint);font:11px var(--mono);white-space:nowrap;
  font-variant-numeric:tabular-nums;flex:0 0 auto}
/* meters */
.mcardx{margin-top:10px}
.meters{display:flex;gap:26px;row-gap:14px;flex-wrap:wrap;align-items:center}
.meter{display:flex;align-items:center;gap:11px}
.gauge{width:72px;height:72px;border-radius:50%;position:relative;flex:0 0 72px;
  display:flex;align-items:center;justify-content:center;
  background:conic-gradient(var(--gc,var(--ok)) var(--p,0%),#242c35 0);
  transition:--p .9s cubic-bezier(.2,.8,.2,1)}
.gauge::before{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--card)}
.gauge b{position:relative;font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink)}
.gauge.goff{background:#242c35}
.gauge.goff b{color:var(--faint);font-weight:600}
.mlab{font-size:12.5px;color:var(--mut);line-height:1.4;font-weight:600}
.msub{display:block;color:var(--faint);font-size:11px;font-weight:400;font-variant-numeric:tabular-nums}
.mfoot{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
.mfoot .chip{font-size:11.5px;padding:2px 10px}
.mfoot .age{margin-left:auto;color:var(--faint);font-size:11px;font-variant-numeric:tabular-nums}
/* entrance motion — only while .anim is on the section (first paint) */
.budget.anim .tbar{animation:bgrow .55s cubic-bezier(.2,.8,.25,1) backwards}
.budget.anim .mseg{animation:bgrowx .7s cubic-bezier(.2,.8,.25,1) backwards}
.budget.anim .hero{animation:bfade .45s ease backwards}
@keyframes bgrow{from{transform:scaleY(0)}}
@keyframes bgrowx{from{transform:scaleX(0)}}
@keyframes bfade{from{opacity:0;transform:translateY(6px)}}
@media (prefers-reduced-motion:reduce){
  .budget.anim .tbar,.budget.anim .mseg,.budget.anim .hero{animation:none}
  .gauge{transition:none}
}
@media(max-width:720px){
  .heroes{grid-template-columns:repeat(2,1fr)}
  .bgrid{grid-template-columns:1fr}
  .hnum{font-size:24px}
}
@media(max-width:360px){
  .heroes{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="wrap">
<h1>Claude Watcher</h1>
<p class="sub">Observed from outside — file writes and transcript tails, never self-reporting. Local sessions only
(cloud <code>session_</code> IDs leave no tracks here). Auto-refreshes every 30s.</p>

<!-- ============ budget / usage (rendered by renderBudget) ============ -->
<section class="budget" id="budget" hidden>
  <div class="bhead"><h2>Usage &amp; Budget</h2><span class="bstamp" id="bstamp"></span></div>
  <div class="bwarn" id="bwarn" hidden></div>
  <div class="heroes" id="heroes"></div>
  <div class="bgrid" id="bgrid">
    <div class="bcard"><div class="blabel">14-day trend</div><div id="trend"></div></div>
    <div class="bcard"><div class="blabel">Model mix</div><div id="mix"></div></div>
  </div>
  <div class="bcard mcardx" id="mcardx"><div class="blabel">Rate limits</div><div id="meters"></div></div>
</section>

<h2>Sessions</h2>
<div class="topbar"><div class="strip" id="strip"></div><input id="q" class="search" type="search" placeholder="filter sessions…" autocomplete="off"></div>
<div id="sessions"></div>
<h2>Relay</h2>
<div class="card" id="relay"></div>
<div class="card" hidden><code id="usage"></code></div>
<p class="stamp" id="stamp"></p>
</div>
<script>
var INLINE=null;
var DATA=INLINE,Q="";
var F;try{F=JSON.parse(localStorage.getItem("wf"))||null}catch(e){F=null}
if(!F||F.working===undefined)F={working:true,quiet:true,idle:true,cli:true};
function save(){try{localStorage.setItem("wf",JSON.stringify(F))}catch(e){}}
function ago(s){if(s==null)return "—";if(s<90)return s+"s ago";if(s<5400)return Math.round(s/60)+"m ago";if(s<172800)return Math.round(s/3600)+"h ago";return Math.round(s/86400)+"d ago"}
function dur(s){return s==null?"?":(s<90?s+"s":s<5400?Math.round(s/60)+"m":Math.round(s/3600)+"h")}
function tok(t){return !t?"":t<1000?t+" tok":(t/1000).toFixed(1)+"k tok"}
function esc(t){return String(t||"").replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function act(t){t=String(t||"");var tool=/^[A-Za-z0-9_]+:|^[A-Za-z0-9_]+ /.test(t)&&/mcp__|^[A-Z][a-zA-Z]+:/.test(t);
  t=t.replace(/^mcp__/,"").replace(/__/g," · ");return {ico:tool?"🔧":"💬",text:t}}
function saRow(a){
  var d=act(a.doing||a.task), role=a.role||"agent";
  var full=esc((a.task||"")+(a.doing?"  →  "+a.doing:""));
  return '<div class="sa '+(a.active?'on':'off')+'"><span class="sd"></span>'+
    '<span class="role">'+esc(role)+'</span>'+
    '<code title="'+full.replace(/"/g,"&quot;")+'">'+esc(d.text)+'</code>'+
    '<span class="rt">'+(a.active?dur(a.runtime_s)+' ⏱':'done · '+dur(a.runtime_s))+(a.tok?' · '+tok(a.tok):'')+'</span></div>';
}
function card(s){
  var subs=s.subagent_list||[], on=subs.filter(function(a){return a.active}), off=subs.filter(function(a){return !a.active});
  var dg=s.doing?act(s.doing):null;
  var spark=(function(){var sp=s.spark||[];var mx=Math.max.apply(null,sp.concat([0]));if(!mx)return '';
    return '<div class="spark" title="events per 5 min, last hour">'+sp.map(function(v){return '<i style="height:'+Math.max(2,Math.round(v/mx*16))+'px'+(v?'':';opacity:.25')+'"></i>'}).join("")+'</div>';})();
  return '<div class="card '+s.state+'"><div class="row"><div class="dot"></div>'+
    '<span class="t">'+esc(s.title)+'</span>'+
    (on.length?'<span class="badge">'+on.length+' subagent'+(on.length>1?'s':'')+'</span>':'')+
    (s.kind=='cli'?'<span class="mchip cli">CLI</span>':'')+
    '<span class="mchip">'+esc((s.model||"").replace("claude-",""))+'</span>'+
    '<span class="meta"><b>'+ago(s.age_s)+'</b>'+(s.created_s?' · up '+dur(s.created_s):'')+'<br><span class="sid">'+esc(s.id)+'</span></span></div>'+
    (dg?'<div class="doing"><span class="ico">'+dg.ico+'</span><code>'+esc(dg.text)+'</code></div>':'')+spark+
    (on.length?'<div class="subs">'+on.map(saRow).join("")+'</div>':'')+
    (off.length?'<details class="done"><summary>'+off.length+' finished in the last 30 min</summary><div class="subs">'+off.map(saRow).join("")+'</div></details>':'')+
    '</div>';
}
function render(){
  if(!DATA)return;
  var d=DATA, ss=d.sessions||[];
  var n={working:0,quiet:0,idle:0,cli:0};
  ss.forEach(function(s){n[s.state]++;if(s.kind=='cli')n.cli++});
  var rl=d.relay||{}, paused=rl.paused_stop||rl.halt;
  var genAge=Math.round(Date.now()/1000-d.generated_at);
  function tg(f,dotColor,label,count){
    return '<span class="chip tog '+(F[f]?'':'off')+'" data-f="'+f+'">'+
      (dotColor?'<span class="d" style="background:'+dotColor+'"></span>':'')+'<b>'+count+'</b> '+label+'</span>';
  }
  document.getElementById("strip").innerHTML=
    tg("working","var(--ok)","working",n.working)+
    tg("quiet","var(--warn)","quiet",n.quiet)+
    tg("idle","var(--off)","idle",n.idle)+
    tg("cli","","CLI",n.cli)+
    '<span class="chip '+(paused?'paused':'')+'">'+(paused?'⏸ relay paused':'▶ relay autonomous')+'</span>'+
    (genAge>300?'<span class="chip dead">⚠ feed '+dur(genAge)+' stale</span>':'')+
    (/ERROR|expired|no-oauth/i.test(d.usage_last||'')?'<span class="chip dead" title="run: claude login">⚠ budget probe</span>':'');
  var vis=ss.filter(function(s){
    if(s.kind=='cli'){if(!F.cli)return false}
    else if(!F[s.state])return false;
    if(Q){var hay=(s.title+" "+(s.doing||"")+" "+(s.model||"")).toLowerCase();
      var subs=(s.subagent_list||[]).map(function(a){return (a.role||"")+" "+(a.doing||"")}).join(" ").toLowerCase();
      if(hay.indexOf(Q)<0&&subs.indexOf(Q)<0)return false}
    return true});
  document.getElementById("sessions").innerHTML=vis.map(card).join("")||
    '<div class="card empty">Nothing matches — <a id="reset">show everything</a></div>';
  var r=document.getElementById("reset");
  if(r)r.addEventListener("click",function(){F={working:true,quiet:true,idle:true,cli:true};Q="";document.getElementById("q").value="";save();render()});
  document.getElementById("relay").innerHTML=
    '<div class="row"><span class="chip '+(paused?'paused':'')+'">'+(paused?'PAUSED'+(rl.halt?' (.halt)':' (.stop)'):'AUTONOMOUS')+'</span>'+
    '<span class="meta">log '+(rl.log_age_s==null?"—":ago(rl.log_age_s))+'</span></div>'+
    '<div style="margin-top:8px"><code>'+esc(rl.log_last||"")+'</code></div>';
  var ul=d.usage_last||"—", bad=/ERROR|expired|no-oauth/i.test(ul);
  document.getElementById("usage").innerHTML=bad
    ?'<span style="color:var(--red)">⚠ probe failing — Claude Code\'s OAuth token was cleared. Fix: run <b>claude login</b> on this Mac.</span><br><span style="color:var(--faint)" title="'+esc(ul).replace(/"/g,"&quot;")+'">'+esc(ul.slice(0,110))+'…</span>'
    :esc(ul);
  document.getElementById("stamp").textContent="Generated "+ago(genAge)+" · regenerates every 60s on the mini";
}
document.getElementById("strip").addEventListener("click",function(e){
  var c=e.target.closest(".tog");if(!c)return;
  var f=c.getAttribute("data-f");F[f]=!F[f];save();render();
});
document.getElementById("q").addEventListener("input",function(e){Q=e.target.value.trim().toLowerCase();render()});
async function load(){
  try{
    var r=await fetch("status.json?cb="+Date.now());DATA=await r.json();render();
  }catch(e){
    if(INLINE){render()}
    else document.getElementById("stamp").textContent="status.json unreachable — generator may be off"
  }
}
if(INLINE){render()}
load();setInterval(load,30000);
if(INLINE&&location.protocol==="file:"){setTimeout(function(){location.reload()},60000)}
</script>
<script>
/* ============ budget section — additive only. Wraps render() so every
   refresh also repaints the budget panels; touches no existing ids. ============ */
(function(){
"use strict";
var firstPaint=true;

function fmtM(t){
  t=+t||0;
  if(!t)return "0";
  if(t<1e6)return Math.round(t/1e3)+"k";
  return (t/1e6).toLocaleString("en-US",{minimumFractionDigits:1,maximumFractionDigits:1})+"M";
}
function fmtCost(c){return "$"+(+c||0).toFixed(2)}
function gaugeColor(p){return p>=80?"var(--red)":p>=60?"var(--warn)":"var(--ok)"}
function modelColor(m){
  m=String(m||"").toLowerCase();
  if(m.indexOf("opus")>=0)return "#e5484d";
  if(m.indexOf("sonnet")>=0)return "#e0b24a";
  if(m.indexOf("haiku")>=0)return "#4cc38a";
  return "#5c6670";
}
function shortModel(m){return String(m||"").replace(/-\d{8}$/,"")}
function fdate(d){
  var mo=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var p=String(d||"").split("-");
  return p.length===3?mo[(+p[1]-1)]+" "+(+p[2]):esc(d);
}
function countUp(el,target){
  var t0=performance.now(),dur=900;
  function step(t){
    var k=Math.min(1,(t-t0)/dur);k=1-Math.pow(1-k,3);
    el.textContent=fmtM(target*k);
    if(k<1)requestAnimationFrame(step);else el.textContent=fmtM(target);
  }
  requestAnimationFrame(step);
}

function heroCard(key,label,c,i){
  if(!c)return '<div class="hero" style="animation-delay:'+(i*60)+'ms"><div class="hlabel">'+label+'</div><div class="hnum">—</div><div class="hdelta flat">no data</div></div>';
  var deltaHtml;
  if(key==="all_time"){
    deltaHtml='<div class="hdelta flat">'+esc(c.note||"all time")+'</div>';
  }else if(c.delta_pct==null){
    deltaHtml='<div class="hdelta flat">—</div>';
  }else{
    var up=c.delta_pct>0, down=c.delta_pct<0;
    var cls=up?"up":down?"down":"flat", tri=up?"▲":down?"▼":"—";
    var pfx=up?"+":"";
    var vs=c.prior_tokens!=null?' <span class="hvs">vs '+fmtM(c.prior_tokens)+'</span>':'';
    deltaHtml='<div class="hdelta '+cls+'" title="'+esc(c.prior_label||"")+
      (c.prior_tokens!=null?': '+fmtM(c.prior_tokens)+' tokens':'')+'">'+
      tri+' '+pfx+(+c.delta_pct).toFixed(1)+'%'+vs+'</div>';
  }
  return '<div class="hero" style="animation-delay:'+(i*60)+'ms">'+
    '<div class="hlabel">'+label+'</div>'+
    '<div class="hnum" data-tok="'+(+c.tokens||0)+'">'+fmtM(c.tokens)+'</div>'+
    deltaHtml+
    (c.cost>0?'<div class="hcost" title="cost">'+fmtCost(c.cost)+'</div>':'')+
    '</div>';
}

function renderTrend(sp){
  var el=document.getElementById("trend");
  if(!sp||!sp.length){el.innerHTML='<div class="bmut">no trend data yet</div>';return}
  var mx=Math.max.apply(null,sp.map(function(x){return x.tokens||0}).concat([1]));
  var n=sp.length;
  el.innerHTML='<div class="tbars">'+sp.map(function(x,i){
    var v=x.tokens||0;
    var h=Math.max(3,Math.round(v/mx*74));
    var last=i===n-1;
    var op=v?(0.35+0.65*(i/Math.max(1,n-1))).toFixed(2):"0.15";
    return '<div class="tcol" title="'+esc(x.date)+' · '+fmtM(v)+' tokens">'+
      '<div class="tbar'+(last?' now':'')+'" style="height:'+h+'px;'+
      (last&&v?'':'opacity:'+op+';')+'animation-delay:'+(i*40)+'ms"></div></div>';
  }).join("")+'</div>'+
  '<div class="taxis"><span>'+fdate(sp[0].date)+'</span><span class="now">today</span></div>';
}

function renderMix(mm){
  var el=document.getElementById("mix");
  if(!mm||!mm.length){el.innerHTML='<div class="bmut">no model data yet</div>';return}
  var bar=mm.map(function(x,i){
    var t='title="'+esc(shortModel(x.model))+' · '+(x.pct||0)+'% · '+fmtM(x.tokens)+' tokens · '+fmtCost(x.cost)+'"';
    return '<div class="mseg" '+t+' style="flex:'+Math.max(1,+x.tokens||1)+
      ';background:'+modelColor(x.model)+';animation-delay:'+(i*90)+'ms"></div>';
  }).join("");
  var legend=mm.map(function(x){
    var pct=(x.pct===0&&x.tokens>0)?"&lt;1%":(x.pct||0)+"%";
    return '<div class="mrow"><span class="mdot" style="background:'+modelColor(x.model)+'"></span>'+
      '<span class="mname">'+esc(shortModel(x.model))+'</span>'+
      '<span class="mpct">'+pct+'</span>'+
      '<span class="mcost">'+fmtM(x.tokens)+' · '+fmtCost(x.cost)+'</span></div>';
  }).join("");
  el.innerHTML='<div class="mixbar">'+bar+'</div><div class="mlegend">'+legend+'</div>';
}

function gaugeHtml(label,pct,sub){
  pct=Math.max(0,Math.min(100,Math.round(+pct||0)));
  return '<div class="meter"><div class="gauge" data-p="'+pct+'" style="--p:'+pct+'%;--gc:'+gaugeColor(pct)+'">'+
    '<b>'+pct+'%</b></div><div class="mlab">'+label+'<span class="msub">'+sub+'</span></div></div>';
}
function renderMeters(m){
  var el=document.getElementById("meters");
  if(!m||m.ok===false){
    el.innerHTML='<div class="bmut">meters pending — probe hasn\'t run yet</div>';
    return;
  }
  var h=gaugeHtml("Session",m.session_pct,"resets "+esc(m.session_resets||"—"))+
        gaugeHtml("Weekly",m.weekly_pct,"resets "+esc(m.weekly_resets||"—"));
  if(m.extra&&m.extra.enabled){
    var ep=m.extra.pct!=null?m.extra.pct:(m.extra.cap?100*m.extra.used/m.extra.cap:0);
    h+=gaugeHtml("Extra",ep,fmtCost(m.extra.used)+" of $"+(+m.extra.cap||0).toFixed(0));
  }else{
    h+='<div class="meter"><div class="gauge goff"><b>—</b></div><div class="mlab">Extra<span class="msub">overage off</span></div></div>';
  }
  var foot="";
  (m.scoped||[]).forEach(function(s){
    var p=Math.round(+s.pct||0);
    foot+='<span class="chip" style="color:'+gaugeColor(p)+'"><b>'+esc(s.name)+'</b> '+p+'%</span>';
  });
  if(m.age_s!=null)foot+='<span class="age">probed '+ago(m.age_s)+'</span>';
  el.innerHTML='<div class="meters">'+h+'</div>'+(foot?'<div class="mfoot">'+foot+'</div>':'');
}

window.renderBudget=function(){
  var sec=document.getElementById("budget");
  if(!DATA){sec.hidden=true;return}
  var b=DATA.budget;
  if(!b){sec.hidden=true;return}
  sec.hidden=false;

  /* tiny inline probe warning (replaces the old "Last budget probe" card) */
  var warn=document.getElementById("bwarn"), ul=DATA.usage_last||"";
  if(/ERROR|expired|no-oauth/i.test(ul)){
    warn.hidden=false;
    warn.innerHTML='⚠ budget probe failing — run <b>claude login</b> on the mini. '+
      '<span class="tail" title="'+esc(ul).replace(/"/g,"&quot;")+'">'+esc(ul.slice(0,80))+'…</span>';
  }else warn.hidden=true;

  var heroes=document.getElementById("heroes"),
      bgrid=document.getElementById("bgrid"),
      mcardx=document.getElementById("mcardx"),
      bstamp=document.getElementById("bstamp");

  if(b.error){
    heroes.innerHTML='<div class="bcard berr">⚠ budget data unavailable: <code>'+esc(b.error)+'</code></div>';
    heroes.style.gridTemplateColumns="1fr";
    bgrid.hidden=true;mcardx.hidden=true;bstamp.textContent="";
    return;
  }
  heroes.style.gridTemplateColumns="";
  bgrid.hidden=false;mcardx.hidden=false;
  bstamp.textContent=b.updated_s!=null?"updated "+ago(b.updated_s):"";

  var cards=b.cards||{};
  heroes.innerHTML=[["today","TODAY"],["week","THIS WEEK"],["month","THIS MONTH"],["all_time","ALL TIME"]]
    .map(function(o,i){return heroCard(o[0],o[1],cards[o[0]],i)}).join("");

  renderTrend(b.sparkline);
  renderMix(b.model_mix);
  renderMeters(b.meters);

  if(firstPaint){
    firstPaint=false;
    sec.classList.add("anim");
    /* count the hero numbers up */
    Array.prototype.forEach.call(heroes.querySelectorAll(".hnum[data-tok]"),function(el){
      countUp(el,+el.getAttribute("data-tok"));
    });
    /* sweep the gauges from 0 to their value */
    Array.prototype.forEach.call(document.querySelectorAll("#meters .gauge[data-p]"),function(g){
      var target=g.style.getPropertyValue("--p");
      g.style.setProperty("--p","0%");
      requestAnimationFrame(function(){requestAnimationFrame(function(){
        g.style.setProperty("--p",target);
      })});
    });
    setTimeout(function(){sec.classList.remove("anim")},1900);
  }
};

/* wrap the existing render() so the budget repaints on every refresh */
var _render=render;
render=function(){_render();renderBudget()};
if(DATA)renderBudget();
})();
</script>

<script id="heatfx-js">
(function () {
  'use strict';
  if (window.__heatfxInstalled) return;
  window.__heatfxInstalled = true;

  var REDUCED = !!(window.matchMedia &&
                   window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  var lastTier = -1;
  var timers = [];
  var state = { heroField: null, mascot: null, mascotTier: 0 };

  function later(fn, ms) { var id = setTimeout(fn, ms); timers.push(id); return id; }
  function clearTimers() { for (var i = 0; i < timers.length; i++) clearTimeout(timers[i]); timers.length = 0; }

  /* ---------- data ---------- */
  function heatData() {
    try {
      var b = window.DATA && window.DATA.budget;
      if (!b || b.error || !b.heat) return {};
      return b.heat;
    } catch (e) { return {}; }
  }
  function effTier() {
    // the "Token Maxxxxxing" music button forces the full party while it plays
    if (typeof window.__heatForce === 'number') return Math.max(0, Math.min(3, window.__heatForce));
    var m = /[?&]heat=([0-3])(?:&|$)/.exec(window.location.search);
    if (m) return +m[1];
    var t = heatData().tier;
    if (typeof t !== 'number' || !isFinite(t)) return 0;
    return Math.max(0, Math.min(3, Math.floor(t)));
  }
  function fmtTokens(n) {
    if (typeof n !== 'number' || !isFinite(n)) return '';
    if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
    if (n >= 1e3) return (n / 1e3).toFixed(1) + 'k';
    return String(Math.round(n));
  }
  function badgeText(tier) {
    return tier >= 3 ? '🔥 record pace'
         : tier === 2 ? '🔥 on a tear'

  function overlay() {
    var el = document.getElementById('heatfx');

    var b = document.getElementById('budget');

    var b = document.getElementById('heatfx-badge');

  function spikyPath(cx, cy, rIn, rOut, spikes) {
    var pts = spikes * 2, d = '';

      var a = (Math.PI * 2 * i) / pts - Math.PI / 2;
      // pseudo-random fuzz on the spike tips so the silhouette reads furry, not gear-like
      var wob = 0.88 + 0.24 * (((i * 7) % 5) / 5);
      var r = (i % 2) ? rIn : rOut * wob;
      var x = cx + Math.cos(a) * r;
      var y = cy + Math.sin(a) * r;

      s += '<path fill="url(#hfxFlame)" d="M78,54 C70,32 84,22 82,6 C96,18 96,36 92,50 Z"/>';
      s += '<path fill="url(#hfxFlame)" d="M106,46 C100,22 116,14 112,-4 C130,12 128,34 120,48 Z"/>';
      s += '<path fill="url(#hfxFlame)" d="M138,56 C134,36 148,30 146,14 C158,28 156,44 150,56 Z"/>';
      s += '</g>';
    }
    // fuzzy ember body
    s += '<path filter="url(#hfxFuzz)" fill="url(#hfxFur)" d="' + body + '"/>';
    // little arms thrown up in delight
    s += '<g class="hfx-armL">';
    s += '<path d="M52,128 C34,112 26,92 30,70" stroke="#c93222" stroke-width="11" stroke-linecap="round" fill="none"/>';
    s += '<circle cx="30" cy="66" r="10" fill="#ffb54d"/>';
    s += '</g>';
    s += '<g class="hfx-armR">';
    s += '<path d="M168,128 C186,112 194,92 190,70" stroke="#c9322c" stroke-width="11" stroke-linecap="round" fill="none"/>';
    s += '<circle cx="190" cy="66" r="10" fill="#ffb54d"/>';
    s += '</g>';
    // giant googly eyes
    s += '<circle cx="84" cy="96" r="20" fill="#fff" stroke="#3a1206" stroke-width="2.5"/>';
    s += '<circle cx="136" cy="96" r="20" fill="#fff" stroke="#3a1206" stroke-width="2.5"/>';
    s += '<g class="hfx-pL"><circle cx="84" cy="98" r="8.5" fill="#16090a"/><circle cx="87" cy="95" r="2.5" fill="#fff" opacity=".85"/></g>';
    s += '<g class="hfx-pR"><circle cx="136" cy="98" r="8.5" fill="#16090a"/><circle cx="139" cy="95" r="2.5" fill="#fff" opacity=".85"/></g>';
    // wide open goofy grin + tongue
    s += '<path fill="#4a1007" d="M66,130 Q110,192 154,130 Q110,150 66,130 Z"/>';
    s += '<path fill="#ff6a55" d="M90,150 Q110,172 130,150 Q110,178 90,150 Z"/>';
    s += '</svg>';
    return s;
  }
  function addMascot(root, tier, ride) {
    var w = document.createElement('div');
    w.className = 'heatfx-mascot' + (tier === 3 ? ' heatfx-mascot--blazing heatfx-crazy' : '');
    w.innerHTML = '<div class="heatfx-bob">' + mascotSvg(tier === 3) + '</div>';
    if (tier === 2) {
      w.classList.add(ride ? 'heatfx-ride' : 'heatfx-parked');
    }
    root.appendChild(w);
    state.mascot = w;
    state.mascotTier = tier;
    positionMascot();
  }
  function positionMascot() {
    if (!state.mascot || state.mascotTier !== 2) return;
    state.mascot.style.top = Math.max(0, budgetTop() - 86) + 'px';
  }

  /* ---------- embers ---------- */
  function emberField(count) {
    var f = document.createElement('div');
    f.className = 'heatfx-emberfield';
    for (var i = 0; i < count; i++) {
      var e = document.createElement('i');
      e.className = 'heatfx-ember';
      e.style.cssText =
        '--x:' + (Math.random() * 100).toFixed(1) + '%;' +
        '--s:' + (4 + Math.random() * 6).toFixed(1) + 'px;' +
        '--dur:' + (2.6 + Math.random() * 2.4).toFixed(2) + 's;' +
        '--delay:' + (Math.random() * 3).toFixed(2) + 's;' +
        '--h:' + Math.round(90 + Math.random() * 90) + 'px;' +
        '--sway:' + Math.round(Math.random() * 44 - 22) + 'px;';
      f.appendChild(e);
    }
    return f;
  }
  function positionHeroField() {
    var f = state.heroField;
    if (!f) return;
    var hero = heroCard();
    if (hero) {
      var r = hero.getBoundingClientRect();
      f.style.left = r.left + 'px';
      f.style.top = r.top + 'px';
      f.style.width = r.width + 'px';
      f.style.height = r.height + 'px';
      f.style.bottom = 'auto';
    } else {
      f.style.left = '4vw'; f.style.width = '30vw';
      f.style.top = 'auto'; f.style.bottom = '0'; f.style.height = '2px';
    }
  }

  /* ---------- tier-3 one-shots ---------- */
  function moneyBlast(root) {
    var wrap = document.createElement('div');
    wrap.className = 'heatfx-money';
    root.appendChild(wrap);
    var hands = [30, 66]; // % across the bottom
    for (var hi = 0; hi < hands.length; hi++) {
      var h = document.createElement('div');
      h.className = 'heatfx-hand';
      h.style.left = hands[hi] + '%';
      h.style.animationDelay = (hi * 0.12) + 's, ' + (0.6 + hi * 0.12) + 's';
      h.textContent = '🙌';
      wrap.appendChild(h);
    }
    var BILLS = 22;
    for (var i = 0; i < BILLS; i++) {
      var b = document.createElement('span');
      b.className = 'heatfx-bill';
      b.textContent = (i % 3 === 0) ? '💸' : '💵';
      var hx = hands[i % 2];
      b.style.cssText =
        'left:calc(' + hx + '% + ' + Math.round(Math.random() * 40 - 20) + 'px);' +
        'font-size:' + Math.round(20 + Math.random() * 12) + 'px;' +
        '--dx:' + Math.round(Math.random() * 520 - 260) + 'px;' +
        '--peak:' + Math.round(-(28 + Math.random() * 30)) + 'vh;' +
        '--r1:' + Math.round(Math.random() * 360 - 180) + 'deg;' +
        '--r2:' + Math.round(Math.random() * 1000 - 500) + 'deg;' +
        'animation-duration:' + (2.1 + Math.random() * 1.1).toFixed(2) + 's;' +
        'animation-delay:' + (0.15 + Math.random() * 1.6).toFixed(2) + 's;';
      b.addEventListener('animationend', function () { this.remove(); });
      wrap.appendChild(b);
    }
    later(function () { // sweep any stragglers, keep the hands celebrating
      var left = wrap.querySelectorAll('.heatfx-bill');
      for (var j = 0; j < left.length; j++) left[j].remove();
    }, 6000);
  }
  function confettiBurst(root) {
    var c = document.createElement('div');
    c.className = 'heatfx-confetti';
    root.appendChild(c);
    var colors = ['#ffd76a', '#ff8a3d', '#e5484d', '#4cc38a', '#e9edf2', '#f0602e'];
    var N = 80;
    for (var i = 0; i < N; i++) {
      var p = document.createElement('i');
      p.style.cssText =
        'background:' + colors[i % colors.length] + ';' +
        'width:' + Math.round(6 + Math.random() * 6) + 'px;' +
        'height:' + Math.round(9 + Math.random() * 7) + 'px;' +
        (Math.random() < 0.3 ? 'border-radius:50%;' : '') +
        '--dx:' + (Math.random() * 76 - 38).toFixed(1) + 'vw;' +
        '--dy:' + (30 + Math.random() * 45).toFixed(1) + 'vh;' +
        '--r:' + Math.round(Math.random() * 1440 - 720) + 'deg;' +
        'animation-duration:' + (1.5 + Math.random() * 1.4).toFixed(2) + 's;' +
        'animation-delay:' + (Math.random() * 0.35).toFixed(2) + 's;';
      p.addEventListener('animationend', function () { this.remove(); });
      c.appendChild(p);
    }
    later(function () { c.remove(); }, 4500);
  }
  function banner(root, isStatic) {
    var h = heatData();
    var sig = h.signals || [];
    var title = (sig.indexOf('record') >= 0) ? '🔥 NEW RECORD' : '🔥 ON FIRE';
    var tok = fmtTokens(h.today);
    var sub = tok ? tok + ' tokens' : 'the meter is screaming';
    var b = document.createElement('div');
    b.className = 'heatfx-banner' + (isStatic ? ' heatfx-static' : '');
    var t1 = document.createElement('div');
    t1.className = 'heatfx-banner-title';
    t1.textContent = title;
    var t2 = document.createElement('div');
    t2.className = 'heatfx-banner-sub';
    t2.textContent = sub;
    b.appendChild(t1); b.appendChild(t2);
    root.appendChild(b);
  }
  function vignette(root) {
    var v = document.createElement('div');
    v.className = 'heatfx-vignette';
    root.appendChild(v);
  }

  /* ---------- build a tier (higher tiers add to lower) ---------- */
  function rebuild(tier, opts) {
    opts = opts || {};
    clearTimers();
    var root = overlay();
    root.innerHTML = '';
    removeBadge();
    setGlow(false);
    state.heroField = null;
    state.mascot = null;
    state.mascotTier = 0;

    if (tier <= 0) return; // cool: nothing at all, zero CPU

    // marker so re-assertion can tell "built" from "wiped"
    var marker = document.createElement('i');
    marker.style.display = 'none';
    root.appendChild(marker);

    setBadge(badgeText(tier));

    if (REDUCED) { // statics only: badge + (tier 3) banner
      if (tier === 3) banner(root, true);
      return;
    }

    // embers: total capped at 26 (8 / 16 / 26)
    var total = [0, 8, 16, 26][tier];
    var heroN = Math.min(total, tier === 1 ? 8 : 10);
    var hf = emberField(heroN);
    root.appendChild(hf);
    state.heroField = hf;
    positionHeroField();
    if (tier >= 2 && total - heroN > 0) {
      var bf = emberField(total - heroN); // bottom-of-screen strip
      bf.style.cssText += 'left:0;bottom:0;width:100vw;height:2px;';
      root.appendChild(bf);
    }

    if (tier >= 2) {
      setGlow(true);
      addMascot(root, tier, !!opts.ride);
    }

    if (tier === 3) {
      vignette(root);
      banner(root, false);
      if (opts.burst) {
        confettiBurst(root);
        moneyBlast(root);
      } else {
        // rebuilt without a rise (e.g. overlay got wiped): keep the hands, skip the blast
        var wrap = document.createElement('div');
        wrap.className = 'heatfx-money';
        for (var hi = 0; hi < 2; hi++) {
          var h = document.createElement('div');
          h.className = 'heatfx-hand';
          h.style.left = (hi ? 66 : 30) + '%';
          h.textContent = '🙌';
          wrap.appendChild(h);
        }
        root.appendChild(wrap);
      }
    }
  }

  // render() repaints page DOM every ~30s and can eat the badge / glow class;
  // when tier is unchanged, quietly re-assert instead of rebuilding (no burst replays).
  function reassert(tier) {
    if (!document.getElementById('heatfx-badge')) setBadge(badgeText(tier));
    if (tier >= 2) setGlow(true);
    var ov = document.getElementById('heatfx');
    if (!ov || !ov.firstChild) rebuild(tier, { ride: false, burst: false });
    else {
      positionHeroField(); positionMascot();
      if (tier === 3) { var sub = ov.querySelector('.heatfx-banner-sub'); if (sub) { var tk = fmtTokens(heatData().today); if (tk) sub.textContent = tk + ' tokens'; } }
    }
  }

  window.renderHeat = function () {
    try {
      var tier = effTier();
      if (tier === lastTier) {
        if (tier > 0) reassert(tier);
        return;
      }
      var prev = lastTier;
      lastTier = tier;
      rebuild(tier, {
        ride:  tier >= 2 && prev < 2,   // mascot rides in only when heat RISES into 2+
        burst: tier === 3 && prev < 3   // confetti + money only when heat RISES into 3
      });
    } catch (e) {
      // the party must never take down the dashboard
      if (window.console && console.warn) console.warn('heatfx:', e);
    }
  };

  /* ---------- housekeeping ---------- */
  document.addEventListener('visibilitychange', function () {
    document.documentElement.classList.toggle('heatfx-paused', document.hidden);
  });

  var rszTimer = null;
  window.addEventListener('resize', function () {
    clearTimeout(rszTimer);
    rszTimer = setTimeout(function () {
      positionHeroField();
      positionMascot();
    }, 150);
  });

  // hook the existing repaint loop
  if (typeof window.render === 'function' && !window.render.__heatfxWrapped) {
    var _r2 = window.render;
    window.render = function () {
      _r2.apply(this, arguments);
      if (window.renderHeat) window.renderHeat();
    };
    window.render.__heatfxWrapped = true;
  }

  // first paint in case DATA is already here (or ?heat= override is set)
  try { window.renderHeat(); } catch (e) {}
})();
</script>

<style id="tdfw-css">
.tdfw-row{ margin:2px 0 12px; }
.tdfw-btn{
  cursor:pointer; pointer-events:auto; -webkit-appearance:none; appearance:none;
  font:700 12.5px/1 system-ui,-apple-system,"Segoe UI",sans-serif; letter-spacing:.02em;
  color:#1a1204; background:linear-gradient(180deg,#ffd76a,#ff9a3d);
  border:1px solid rgba(255,180,90,.6); border-radius:999px;
  padding:8px 15px; white-space:normal; text-align:center; max-width:100%;
  animation:tdfw-invite 2.6s ease-in-out infinite; transition:transform .1s,filter .1s;
}
.tdfw-btn:hover{ filter:brightness(1.07); }
.tdfw-btn:active{ transform:translateY(1px); }
@keyframes tdfw-invite{ 0%,100%{ box-shadow:0 0 0 rgba(255,138,61,0);} 50%{ box-shadow:0 0 15px rgba(255,138,61,.55);} }
.tdfw-btn.playing{
  color:#fff; background:linear-gradient(180deg,#e5484d,#c9302c);
  border-color:rgba(255,120,90,.7); animation:tdfw-throb .5s ease-in-out infinite;
}
@keyframes tdfw-throb{ 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.045);} }
@media (prefers-reduced-motion: reduce){ .tdfw-btn, .tdfw-btn.playing{ animation:none; } }
</style>
<audio id="tdfwAudio" preload="none" loop></audio>
<script id="tdfw-js">
(function () {
  'use strict';
  if (window.__tdfwInstalled) return;
  window.__tdfwInstalled = true;

  var SRC = 'turndownforwhat.mp3';   // served next to this page; supply your own to reuse
  var LABEL = '🔊 Token Maxxxxxing! Turn Down for What!?';

  // plain <audio> (NOT Web Audio): iOS treats media elements as "media" so they
  // play on the silent switch, and a real click gesture always unblocks playback.
  var audio = document.getElementById('tdfwAudio');
  if (!audio) { audio = document.createElement('audio'); audio.id = 'tdfwAudio'; document.body.appendChild(audio); }
  audio.preload = 'none'; audio.loop = true;
  if (!audio.getAttribute('src')) audio.src = SRC;

  var btn = document.createElement('button');
  btn.type = 'button'; btn.id = 'tdfwBtn'; btn.className = 'tdfw-btn'; btn.textContent = LABEL;

  function party(on) {
    window.__heatForce = on ? 3 : null;          // unleash / release the full flame-and-money show
    if (window.renderHeat) { try { window.renderHeat(); } catch (e) {} }
  }
  function setPlaying(on) {
    btn.classList.toggle('playing', on);
    btn.textContent = on ? '⏸ Turn Down for What!? (blasting)' : LABEL;
  }
  btn.addEventListener('click', function () {
    if (audio.paused) { audio.play().catch(function () {}); }
    else { audio.pause(); }
  });
  audio.addEventListener('play',  function () { setPlaying(true);  party(true);  });
  audio.addEventListener('pause', function () { setPlaying(false); party(false); });
  audio.addEventListener('ended', function () { setPlaying(false); party(false); });
  audio.addEventListener('error', function () { var r = document.getElementById('tdfwRow'); if (r) r.style.display = 'none'; });

  function mount() {
    var row = document.getElementById('tdfwRow');
    if (row && row.isConnected) return;
    var budget = document.getElementById('budget');
    if (!budget) return;
    row = document.createElement('div'); row.id = 'tdfwRow'; row.className = 'tdfw-row';
    row.appendChild(btn);
    var anchor = document.getElementById('bwarn') || document.getElementById('heroes');
    if (anchor) budget.insertBefore(row, anchor); else budget.appendChild(row);
  }
  mount();
  setInterval(mount, 2500);   // re-seat if a repaint ever removes it
})();
</script>
